<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜数字游戏</title>
<style>
  :root{
    --bg:#0a0e0a;
    --panel:#0d130e;
    --line:#1d3a27;
    --green:#3dff88;
    --green-dim:#1c5c38;
    --ink:#c9f5d8;
    --muted:#5f8f6d;
    --amber:#ffc857;
    --red:#ff6b6b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    user-select:none;
    -webkit-user-select:none;
  }
  .terminal{
    width:100%;
    max-width:620px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 0 0 1px rgba(61,255,136,.05), 0 0 48px rgba(61,255,136,.06), inset 0 0 70px rgba(61,255,136,.03);
    overflow:hidden;
    position:relative;
  }
  /* 微弱的 CRT 扫描线，仅作质感 */
  .terminal::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px);
    opacity:.35;
    z-index:9;
  }
  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(61,255,136,.04);
    color:var(--muted);
    font-size:13px;
    letter-spacing:.04em;
  }
  .titlebar .prompt-tag{ color:var(--green); }
  .view{ padding:26px 24px 30px; }
  .hidden{ display:none !important; }

  /* ===== 视图：菜单 ===== */
  #menuView{ text-align:center; }
  .ascii-logo{
    font-size:15px;
    line-height:1.55;
    color:var(--green);
    text-shadow:0 0 12px rgba(61,255,136,.35);
    margin-bottom:8px;
    white-space:pre;
  }
  .menu-btns{ display:flex; flex-direction:column; gap:14px; align-items:center; margin-top:26px; }
  .btn{
    min-height:48px;
    padding:0 34px;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--green-dim);
    border-radius:6px;
    font-family:inherit;
    font-size:16px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .btn:hover{ background:var(--green); color:#08120c; border-color:var(--green); box-shadow:0 0 18px rgba(61,255,136,.35); }
  .btn:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }
  .menu-btns .btn{ width:min(320px,100%); }
  .hint{ margin-top:20px; color:var(--muted); font-size:13px; letter-spacing:.05em; }
  .quit-line{ margin-top:14px; color:var(--green); font-size:14px; min-height:20px; text-shadow:0 0 10px rgba(61,255,136,.3); }

  /* ===== 视图：游戏 ===== */
  .statusbar{
    display:flex; flex-wrap:wrap; gap:10px 18px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:rgba(61,255,136,.03);
    margin-bottom:16px;
    font-size:14px;
  }
  .stat{ display:flex; align-items:center; gap:8px; min-height:22px; }
  .stat .k{ color:var(--muted); }
  .stat .v{ color:var(--ink); }
  .chance-dots{ display:inline-flex; gap:4px; }
  .chance-dots i{
    width:10px; height:10px; border-radius:2px;
    background:var(--green-dim);
    display:inline-block;
    box-shadow:0 0 6px rgba(61,255,136,.15);
  }
  .chance-dots i.on{ background:var(--green); box-shadow:0 0 8px rgba(61,255,136,.5); }
  .log{
    height:300px;
    overflow-y:auto;
    padding:14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#0a0f0b;
    font-size:15px;
    line-height:1.7;
    overscroll-behavior:contain;
    touch-action:pan-y;
  }
  .log::-webkit-scrollbar{ width:8px; }
  .log::-webkit-scrollbar-track{ background:transparent; }
  .log::-webkit-scrollbar-thumb{ background:var(--green-dim); border-radius:4px; }
  .log-line{ white-space:pre-wrap; word-break:break-all; }
  .log-line .usr{ color:var(--green); font-weight:600; }
  .log-line.dim{ color:var(--muted); }
  .log-line.warn{ color:var(--amber); }
  .log-line.win{ color:var(--green); text-shadow:0 0 10px rgba(61,255,136,.45); }
  .log-line.lose{ color:var(--red); }
  .log-line.hl{ color:var(--green); }
  .log-line.answer{ color:var(--amber); }
  .log-line .ts{ color:var(--muted); font-size:13px; }
  .log-line.animate{ animation:lineIn .22s ease-out; }
  @keyframes lineIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  .inputline{
    display:flex; align-items:center; gap:10px;
    margin-top:14px;
  }
  .prompt{
    color:var(--green);
    font-size:20px;
    font-weight:700;
    min-width:16px;
    animation:blink 1.1s steps(1) infinite;
    text-shadow:0 0 10px rgba(61,255,136,.5);
  }
  @keyframes blink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:0; } }
  .inputline input{
    flex:1;
    min-height:48px;
    padding:0 14px;
    background:#0a0f0b;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--green);
    font-family:inherit;
    font-size:17px;
    caret-color:var(--green);
    outline:none;
  }
  .inputline input:focus{ border-color:var(--green-dim); box-shadow:0 0 0 1px rgba(61,255,136,.25); }
  .inputline input::placeholder{ color:#2c4a37; }
  .inputline input::-webkit-outer-spin-button,
  .inputline input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .inputline input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .inputline .btn{ min-width:88px; }

  /* ===== 面板：结果 ===== */
  .panel{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(4,8,5,.78);
    backdrop-filter:blur(2px);
    z-index:20;
    padding:20px;
  }
  .panel-inner{
    width:min(440px,100%);
    background:var(--panel);
    border:1px solid var(--green-dim);
    border-radius:10px;
    box-shadow:0 0 40px rgba(61,255,136,.15), 0 0 0 1px rgba(61,255,136,.06);
    padding:30px 26px;
    text-align:center;
    animation:panelIn .25s ease-out;
  }
  @keyframes panelIn{ from{ opacity:0; transform:scale(.96) translateY(6px); } to{ opacity:1; transform:none; } }
  .panel-inner h2{ font-size:22px; margin-bottom:14px; letter-spacing:.04em; }
  .panel-inner h2.win{ color:var(--green); text-shadow:0 0 14px rgba(61,255,136,.4); }
  .panel-inner h2.lose{ color:var(--red); text-shadow:0 0 14px rgba(255,107,107,.35); }
  .panel-inner .msg{ font-size:15px; line-height:1.8; color:var(--ink); min-height:56px; }
  .panel-inner .msg .answer{ color:var(--amber); }
  .panel-inner .bestline{ margin-top:6px; font-size:14px; color:var(--muted); }
  .panel-inner .bestline b{ color:var(--green); }
  .panel-btns{ display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .panel-btns .btn{ min-width:130px; }

  @media (max-width:520px){
    .view{ padding:20px 16px 24px; }
    .ascii-logo{ font-size:12px; }
    .statusbar{ font-size:13px; gap:8px 12px; }
    .log{ height:240px; font-size:14px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<main class="terminal">
  <div class="titlebar">
    <span class="prompt-tag">$</span>
    <span>源.c — guess-number-game &nbsp;·&nbsp; 1~100 &nbsp;·&nbsp; 5 次机会</span>
  </div>

  <!-- ===== 视图：菜单 ===== -->
  <section class="view" id="menuView">
    <pre class="ascii-logo">*******************************
*****      猜数字游戏     *****
*******************************
*****   1. 开始游戏       *****
*****   0. 退出游戏       *****
*******************************</pre>
    <div class="menu-btns">
      <button class="btn" id="startBtn" type="button">[ 1 ] 开始游戏</button>
      <button class="btn" id="quitBtn" type="button">[ 0 ] 退出游戏</button>
    </div>
    <p class="quit-line" id="quitLine"></p>
    <p class="hint">按键盘 1 / 0，或点击按钮</p>
  </section>

  <!-- ===== 视图：游戏 ===== -->
  <section class="view hidden" id="gameView">
    <div class="statusbar">
      <div class="stat">
        <span class="k">机会</span>
        <span class="chance-dots" id="chanceDots"></span>
        <span class="v" id="chanceTxt"></span>
      </div>
      <div class="stat">
        <span class="k">用时</span>
        <span class="v" id="timerTxt">0秒</span>
      </div>
      <div class="stat">
        <span class="k">区间</span>
        <span class="v" id="rangeTxt">[1, 100]</span>
      </div>
    </div>
    <div class="log" id="logArea" aria-live="polite"></div>
    <div class="inputline">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="guessInput" type="number" inputmode="numeric" min="1" max="100" placeholder="输入 1~100" autocomplete="off" aria-label="猜的数字">
      <button class="btn" id="submitBtn" type="button">确认</button>
    </div>
  </section>
</main>

<!-- ===== 面板：结果 ===== -->
<div class="panel hidden" id="resultPanel">
  <div class="panel-inner">
    <h2 id="resultTitle" class="win"></h2>
    <p class="msg" id="resultMsg"></p>
    <p class="bestline">最佳纪录：<b id="bestTxt">--</b></p>
    <div class="panel-btns">
      <button class="btn" id="againBtn" type="button">再来一局</button>
      <button class="btn" id="menuBtn" type="button">返回菜单</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===== 状态 ===== */
  var state = {
    phase: "menu",          // menu | playing | over
    secret: 0,
    count: 0,
    low: 1,
    high: 100,
    startAt: 0,
    timerId: null,
    best: null              // 最少次数猜中的纪录
  };

  var MAX_ATTEMPTS = 5;

  /* ===== DOM ===== */
  var menuView   = document.getElementById("menuView");
  var gameView   = document.getElementById("gameView");
  var resultPanel= document.getElementById("resultPanel");
  var logArea    = document.getElementById("logArea");
  var guessInput = document.getElementById("guessInput");
  var submitBtn  = document.getElementById("submitBtn");
  var startBtn   = document.getElementById("startBtn");
  var quitBtn    = document.getElementById("quitBtn");
  var quitLine   = document.getElementById("quitLine");
  var againBtn   = document.getElementById("againBtn");
  var menuBtn    = document.getElementById("menuBtn");
  var chanceDots = document.getElementById("chanceDots");
  var chanceTxt  = document.getElementById("chanceTxt");
  var timerTxt   = document.getElementById("timerTxt");
  var rangeTxt   = document.getElementById("rangeTxt");
  var resultTitle= document.getElementById("resultTitle");
  var resultMsg  = document.getElementById("resultMsg");
  var bestTxt    = document.getElementById("bestTxt");

  /* ===== 最佳纪录（localStorage，隐私模式需容错） ===== */
  function loadBest(){
    try{
      var v = localStorage.getItem("guess-number-best");
      state.best = v === null ? null : parseInt(v, 10);
    }catch(e){ state.best = null; }
  }
  function saveBest(n){
    try{ localStorage.setItem("guess-number-best", String(n)); }catch(e){ /* 隐私模式忽略 */ }
  }
  function refreshBestTxt(){
    bestTxt.textContent = state.best === null ? "--" : state.best + " 次";
  }

  /* ===== 日志 ===== */
  function logLine(html, cls){
    var div = document.createElement("div");
    div.className = "log-line animate" + (cls ? " " + cls : "");
    div.innerHTML = html;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
  }
  function logText(txt, cls){
    logLine(txt.replace(/[&<>]/g, function(m){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;" }[m];
    }), cls);
  }

  /* ===== 计时 ===== */
  function elapsedSec(){
    return Math.floor((Date.now() - state.startAt) / 1000);
  }
  function updateTimer(){
    timerTxt.textContent = elapsedSec() + "秒";
  }
  function startTimer(){
    stopTimer();
    state.startAt = Date.now();
    updateTimer();
    state.timerId = setInterval(updateTimer, 1000);
  }
  function stopTimer(){
    if(state.timerId !== null){
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  /* ===== 状态栏渲染 ===== */
  function renderStatus(){
    var left = MAX_ATTEMPTS - state.count;
    var dots = "";
    for(var i = 0; i < MAX_ATTEMPTS; i++){
      dots += '<i class="' + (i < left ? "on" : "") + '"></i>';
    }
    chanceDots.innerHTML = dots;
    chanceTxt.textContent = "剩余 " + left + " 次";
    rangeTxt.textContent = "[" + state.low + ", " + state.high + "]";
  }

  /* ===== 游戏流程 ===== */
  function startGame(){
    state.phase = "playing";
    state.secret = Math.floor(Math.random() * 100) + 1;
    state.count = 0;
    state.low = 1;
    state.high = 100;

    logArea.innerHTML = "";
    logLine('<span class="usr">$ ./guess-number-game</span>');
    logText("游戏开始, 范围是1~100，请在5次内猜中", "hl");
    renderStatus();
    startTimer();

    gameView.classList.remove("hidden");
    menuView.classList.add("hidden");
    resultPanel.classList.add("hidden");
    guessInput.value = "";
    guessInput.focus();
  }

  function backToMenu(){
    stopTimer();
    state.phase = "menu";
    resultPanel.classList.add("hidden");
    gameView.classList.add("hidden");
    menuView.classList.remove("hidden");
  }

  function submitGuess(){
    if(state.phase !== "playing"){ return; }

    var raw = guessInput.value.trim();
    if(raw === ""){ return; }
    var v = Number(raw);

    if(!Number.isInteger(v) || v < 1 || v > 100){
      logText("无效输入，请输入 1~100 之间的整数（不消耗机会）", "warn");
      guessInput.value = "";
      guessInput.focus();
      return;
    }

    state.count++;
    var t = elapsedSec();
    logLine('<span class="usr">&gt; ' + v + '</span> <span class="ts">(' + t + '秒)</span>');

    if(v > state.secret){
      if(v - 1 < state.high){ state.high = v - 1; }
      logText("猜大了, 还有" + (MAX_ATTEMPTS - state.count) + "次机会", "dim");
    } else if(v < state.secret){
      if(v + 1 > state.low){ state.low = v + 1; }
      logText("猜小了, 还有" + (MAX_ATTEMPTS - state.count) + "次机会", "dim");
    } else {
      logText("恭喜你，猜对了！你用了" + state.count + "次猜中了数字", "win");
      finishGame(true);
      return;
    }

    renderStatus();
    guessInput.value = "";

    if(state.count >= MAX_ATTEMPTS){
      logText("很遗憾，5次机会用完了，游戏失败", "lose");
      logLine("正确的数字是：<span class='answer'>" + state.secret + "</span>", "");
      finishGame(false);
    } else {
      guessInput.focus();
    }
  }

  function finishGame(win){
    state.phase = "over";
    stopTimer();
    updateTimer();

    var titleEl = resultTitle;
    titleEl.className = win ? "win" : "lose";
    titleEl.textContent = win ? "恭喜你，猜对了！" : "很遗憾，游戏失败";

    var msg = win
      ? "你用了 <b>" + state.count + "</b> 次猜中了数字，用时 " + elapsedSec() + " 秒。"
      : "5 次机会用完了。正确的数字是：<span class='answer'>" + state.secret + "</span>";

    if(win && (state.best === null || state.count < state.best)){
      state.best = state.count;
      saveBest(state.count);
      msg += "<br>新的最佳纪录！";
    }
    resultMsg.innerHTML = msg;
    refreshBestTxt();

    resultPanel.classList.remove("hidden");
  }

  /* ===== 事件绑定 ===== */
  function bind(btn, fn){
    btn.addEventListener("click", fn);
    btn.addEventListener("touchstart", function(e){
      if(e.cancelable){ e.preventDefault(); }
      fn();
    }, { passive:false });
  }
  function flashQuit(){
    quitLine.textContent = "$ 退出游戏";
    setTimeout(function(){ quitLine.textContent = ""; }, 1600);
  }
  bind(startBtn, startGame);
  bind(quitBtn, flashQuit);
  bind(submitBtn, submitGuess);
  bind(againBtn, startGame);
  bind(menuBtn, backToMenu);

  guessInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ submitGuess(); }
  });

  window.addEventListener("keydown", function(e){
    if(state.phase === "menu"){
      if(e.key === "1"){ startGame(); }
      else if(e.key === "0"){ flashQuit(); }
    }
  });

  /* ===== 初始化 ===== */
  loadBest();
  refreshBestTxt();
})();
</script>
</body>
</html>
